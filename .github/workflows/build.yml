name: Verify official v1 package baseline

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-baseline:
    name: Complete v1 baseline packages - no release
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install package tools
        run: |
          command -v dpkg-deb >/dev/null || brew install dpkg
          command -v ldid >/dev/null || brew install ldid
      - name: Build and validate rootless and RootHide packages
        run: make deb
      - name: Upload internal baseline verification packages
        uses: actions/upload-artifact@v4
        with:
          name: official-v1-baseline-test-only
          path: build/deb/*.deb
          if-no-files-found: error
