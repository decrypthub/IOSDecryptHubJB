name: Build JB legacy migration baseline

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  legacy-engine:
    name: Legacy engine only - complete deb not implemented
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Compile imported engine for migration verification
        run: make -B VARIANT=rootless ARCHS="arm64 arm64e" all
      - name: Upload internal baseline artifact
        uses: actions/upload-artifact@v4
        with:
          name: idh-jb-legacy-engine-internal
          path: decrypt_helper.dylib
          if-no-files-found: error
