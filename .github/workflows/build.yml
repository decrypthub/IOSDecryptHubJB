name: Verify complete packages

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-baseline:
    name: Complete packages and update policy
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install package tools
        run: |
          command -v dpkg-deb >/dev/null || brew install dpkg
          command -v ldid >/dev/null || brew install ldid
      - name: Test package update policy
        run: make test-updater
      - name: Build and validate rootless and RootHide packages
        run: make deb
      - name: Upload verification packages
        uses: actions/upload-artifact@v4
        with:
          name: complete-packages-test-only
          path: build/deb/*.deb
          if-no-files-found: error
