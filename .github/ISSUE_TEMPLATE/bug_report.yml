name: Bug 报告 / 问题反馈
description: 发现问题时附上审查日志，帮助我们持续改进
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！IOSDecryptHub 通过社区 Issue 自主进化。

        **如何获取审查日志：** 打开 Web 面板（默认 `http://<设备IP>:8088`）→ 点击右上角 **「审查日志」** → **「复制」** 或 **「提交 Issue」**。

        审查日志包含版本、目标 App、hook 健康状态与事件时间线，是排查问题的关键上下文。请勿在公开 Issue 中粘贴 Key / 明文等敏感业务数据（审查日志本身不含捕获的加解密明文）。

  - type: textarea
    id: audit-log
    attributes:
      label: 审查日志
      description: 从 Web 面板「审查日志」复制的完整文本
      placeholder: |
        ==== IOSDecryptHub 审查日志 (diagnostic) ====
        版本: ...
        ...
      render: text
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤
      description: 尽量写清注入方式、目标 App、操作顺序
      placeholder: |
        1. 将 decrypt_helper.dylib 注入到 xxx.ipa
        2. 启动 App，执行 xxx 操作
        3. 观察到 xxx
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望行为
      placeholder: 例如：应能捕获 AES-CBC 调用的 Key 与明文
    validations:
      required: false

  - type: textarea
    id: actual
    attributes:
      label: 实际行为
      placeholder: 例如：hook 未触发 / 面板显示失效 / App 闪退
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: 问题板块
      options:
        - 加解密 hook
        - 文件监控
        - 系统监控 (dlopen)
        - 砸壳 (Dump)
        - Web 面板
        - 悬浮窗 / 原生 UI
        - 注入 / 安装
        - 其它
    validations:
      required: false

  - type: checkboxes
    id: privacy
    attributes:
      label: 确认
      options:
        - label: 我已确认 Issue 中不包含不应公开的敏感业务数据（Key、口令、用户隐私等）
          required: true
